[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-fft"
version = "0.1.0"
description = "Chirp Z-transform and zoomed FFT in PyTorch."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jonathan Dong", email = "jonathan.dong@epfl.ch" }]
keywords = ["fft", "chirp-z-transform", "czt", "zoom-fft", "bluestein", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/jon-dong/minimal-fft"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
